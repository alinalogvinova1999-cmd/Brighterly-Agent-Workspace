<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Brighterly · Agent Workspace</title>
<style>
:root{
  --bg:#F4F6F8; --panel:#FFFFFF; --ink:#1B2230; --muted:#6B7280; --line:#E6E9EE;
  --accent:#F39B2D; --accent-soft:#FEF3E2;
  --urgent:#E5484D; --urgent-soft:#FDECEC;
  --high:#E08600; --high-soft:#FCF1DD;
  --normal:#5B6472; --normal-soft:#EEF1F4;
  --ok:#2E9E5B; --ok-soft:#E6F6EC;
  --blue:#2563EB; --blue-soft:#E8EFFD;
  --discord:#5865F2; --ticket:#0E9F9A; --email:#2563EB; --omni:#F39B2D; --dchan:#7C5CFC;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,.16);
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:13.5px;line-height:1.45;-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:218px 1fr;grid-template-rows:54px 1fr;height:100vh;overflow:hidden}
/* top bar */
.topbar{grid-column:1/3;display:flex;align-items:center;gap:16px;background:var(--panel);border-bottom:1px solid var(--line);padding:0 18px;z-index:30}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:15px}
.logo{width:26px;height:26px;border-radius:7px;background:linear-gradient(135deg,#FBBF4B,#F39B2D);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:15px;box-shadow:0 2px 6px rgba(243,155,45,.4)}
.brand small{font-weight:500;color:var(--muted);font-size:12px;border-left:1px solid var(--line);padding-left:10px;margin-left:2px}
.search{flex:1;max-width:420px;margin:0 auto;position:relative}
.search input{width:100%;border:1px solid var(--line);background:#FAFBFC;border-radius:8px;padding:8px 12px 8px 32px;font-size:13px;outline:none}
.search input:focus{border-color:var(--accent);background:#fff}
.search svg{position:absolute;left:10px;top:9px;color:#9AA1AC}
.topright{display:flex;align-items:center;gap:14px;margin-left:auto}
.bell{position:relative;color:var(--muted);cursor:pointer}
.bell .dot{position:absolute;top:-3px;right:-3px;width:8px;height:8px;background:var(--urgent);border-radius:50%;border:2px solid #fff}
.me{display:flex;align-items:center;gap:8px}
.avatar{width:30px;height:30px;border-radius:50%;background:#DCE3EE;color:#43506B;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:12px;flex:none}
.me .nm{font-weight:600;font-size:12.5px;line-height:1.1}
.me .rl{color:var(--muted);font-size:11px}
/* sidebar */
.side{background:var(--panel);border-right:1px solid var(--line);padding:12px 10px;display:flex;flex-direction:column;gap:2px;overflow:auto}
.navlbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#9AA1AC;font-weight:700;padding:12px 10px 6px}
.nav{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:#41495A;cursor:pointer;font-weight:500;font-size:13px;position:relative}
.nav:hover{background:#F4F6F8}
.nav.active{background:var(--accent-soft);color:#9A5B00;font-weight:600}
.nav.active svg{color:var(--accent)}
.nav svg{color:#8A92A0;flex:none}
.nav .ct{margin-left:auto;font-size:11px;font-weight:700;background:#EDEFF3;color:#5B6472;border-radius:20px;padding:1px 7px}
.nav .ct.red{background:var(--urgent-soft);color:var(--urgent)}
.nav .ct.amber{background:var(--high-soft);color:var(--high)}
.side .spacer{flex:1}
.gov{margin-top:8px;padding:11px;border:1px solid var(--line);border-radius:10px;background:#FAFBFC}
.gov h5{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9AA1AC;margin-bottom:8px}
.gov .row{display:flex;justify-content:space-between;font-size:12px;margin:5px 0;color:#41495A}
.gov .row b{font-variant-numeric:tabular-nums}
.dotgreen{color:var(--ok)} .dotred{color:var(--urgent)}
/* main */
.main{overflow:auto;padding:18px 22px 60px}
.viewhead{display:flex;align-items:flex-end;gap:14px;margin-bottom:4px}
.viewhead h1{font-size:19px;font-weight:700}
.viewhead p{color:var(--muted);font-size:12.5px;margin-bottom:2px}
.toolbar{display:flex;align-items:center;gap:8px;margin:14px 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12.5px;cursor:pointer;color:#41495A;font-weight:500;display:flex;align-items:center;gap:6px;white-space:nowrap}
.chip:hover{border-color:#C9CFD8}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip .x{opacity:.6}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:none;background:#fff;padding:6px 12px;font-size:12.5px;cursor:pointer;color:#41495A;font-weight:500}
.seg button.on{background:#F0F3F7;color:var(--ink);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}
.spacerb{flex:1}
/* inbox list */
.list{background:var(--panel);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
.lhead{display:grid;grid-template-columns:8px 1.9fr 2.4fr 110px 120px 130px;gap:12px;padding:9px 16px;font-size:10.5px;text-transform:uppercase;letter-spacing:.05em;color:#9AA1AC;font-weight:700;border-bottom:1px solid var(--line);background:#FBFCFD}
.li{display:grid;grid-template-columns:8px 1.9fr 2.4fr 110px 120px 130px;gap:12px;padding:13px 16px;border-bottom:1px solid #F0F2F5;align-items:center;cursor:pointer;transition:background .08s}
.li:hover{background:#FAFBFD}
.li:last-child{border-bottom:none}
.pdot{width:8px;height:8px;border-radius:50%;margin-top:5px}
.p-urgent{background:var(--urgent)} .p-high{background:var(--high)} .p-normal{background:#C2C9D2}
.tut{display:flex;align-items:center;gap:10px;min-width:0}
.tut .av{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12px;color:#fff;flex:none}
.tut .nm{font-weight:600;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tut .sub{color:var(--muted);font-size:11.5px}
.snip{min-width:0}
.snip .top{display:flex;align-items:center;gap:7px;margin-bottom:2px}
.snip .txt{color:#525a68;font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tag{font-size:10.5px;font-weight:600;padding:1px 7px;border-radius:5px;background:#EEF1F4;color:#5B6472;white-space:nowrap}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;white-space:nowrap}
.b-discord{background:#ECEDFE;color:var(--discord)} .b-dchan{background:#EFEBFE;color:var(--dchan)}
.b-ticket{background:#E2F6F5;color:var(--ticket)} .b-email{background:var(--blue-soft);color:var(--email)}
.b-omni{background:var(--accent-soft);color:#C77400}
.dotmark{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.sla{font-weight:700;font-size:12.5px;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;line-height:1.15}
.sla small{font-weight:500;color:#9AA1AC;font-size:10px;text-transform:uppercase;letter-spacing:.04em}
.sla.danger{color:var(--urgent)} .sla.warn{color:var(--high)} .sla.ok{color:var(--ok)}
.assign{display:flex;align-items:center;gap:7px;font-size:12px;color:#41495A}
.assign .av{width:24px;height:24px;border-radius:50%;background:#DCE3EE;color:#43506B;font-weight:700;display:flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.collide{display:inline-flex;align-items:center;gap:5px;background:var(--urgent-soft);color:var(--urgent);font-weight:700;font-size:10.5px;padding:2px 7px;border-radius:6px;border:1px solid #F6C9C9;cursor:pointer;white-space:nowrap}
.pulse{width:7px;height:7px;border-radius:50%;background:var(--urgent);animation:pulse 1.4s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(229,72,77,.5)}70%{box-shadow:0 0 0 6px rgba(229,72,77,0)}100%{box-shadow:0 0 0 0 rgba(229,72,77,0)}}
/* stat strip */
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:13px 15px;box-shadow:var(--shadow)}
.stat .k{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-weight:600;display:flex;align-items:center;gap:6px}
.stat .v{font-size:23px;font-weight:800;margin-top:6px;font-variant-numeric:tabular-nums}
.stat .d{font-size:11.5px;margin-top:3px;font-weight:600}
.up{color:var(--ok)} .down{color:var(--urgent)}
/* conflicts */
.conf{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:var(--shadow);margin-bottom:12px;border-left:4px solid var(--urgent)}
.conf.resolved{border-left-color:var(--ok);opacity:.72}
.conf .ch{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.conf .ch h3{font-size:14.5px}
.conf .ch .pill{margin-left:auto}
.versus{display:grid;grid-template-columns:1fr 38px 1fr;gap:0;align-items:stretch;margin-bottom:13px}
.party{border:1px solid var(--line);border-radius:10px;padding:12px;background:#FBFCFD}
.party .who{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.party .who b{font-size:13px}
.party .meta{font-size:12px;color:#525a68;margin:3px 0}
.party .meta b{color:var(--ink)}
.vs{display:flex;align-items:center;justify-content:center;color:var(--urgent);font-weight:800;font-size:12px}
.rec{display:flex;align-items:center;gap:10px;background:var(--accent-soft);border:1px solid #F6DCB0;border-radius:9px;padding:10px 12px;font-size:12.5px;color:#8A5200}
.rec b{color:#6B3F00}
.cact{margin-left:auto;display:flex;gap:8px}
.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 13px;font-size:12.5px;font-weight:600;cursor:pointer;color:#41495A}
.btn:hover{border-color:#C9CFD8}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:#E08600}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.resbar{display:flex;align-items:center;gap:8px;color:var(--ok);font-weight:600;font-size:12.5px}
/* drawer (tutor card) */
.overlay{position:fixed;inset:0;background:rgba(16,24,40,.32);opacity:0;pointer-events:none;transition:opacity .2s;z-index:40}
.overlay.show{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;height:100vh;width:660px;max-width:94vw;background:var(--bg);box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .26s cubic-bezier(.4,0,.2,1);z-index:50;overflow:auto}
.drawer.show{transform:translateX(0)}
.dh{background:var(--panel);border-bottom:1px solid var(--line);padding:16px 20px;position:sticky;top:0;z-index:5}
.dh .top{display:flex;align-items:center;gap:12px}
.dh .av{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;color:#fff;font-size:16px;flex:none}
.dh h2{font-size:17px}
.dh .sub{color:var(--muted);font-size:12.5px}
.dh .close{margin-left:auto;cursor:pointer;color:var(--muted);background:#F0F3F7;border-radius:8px;width:30px;height:30px;display:flex;align-items:center;justify-content:center}
.dh .close:hover{background:#E4E8EE}
.facts{display:flex;gap:8px;margin-top:13px;flex-wrap:wrap}
.fact{background:#F6F8FA;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:11.5px}
.fact b{display:block;font-size:13px;margin-top:1px}
.dbody{padding:18px 20px 50px}
.sechd{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:#9AA1AC;font-weight:700;margin:6px 0 10px;display:flex;align-items:center;gap:8px}
.collab{background:var(--urgent-soft);border:1px solid #F6C9C9;border-radius:10px;padding:11px 13px;margin-bottom:16px;display:flex;align-items:center;gap:11px}
.collab .av{width:30px;height:30px;border-radius:50%;background:#fff;color:var(--urgent);font-weight:700;display:flex;align-items:center;justify-content:center;font-size:11px;border:1px solid #F0B8B8}
.collab .tx{font-size:12.5px;color:#8A2C2F}
.collab .tx b{color:#7A1F22}
.collab .btn{margin-left:auto}
.cases{display:flex;flex-direction:column;gap:8px;margin-bottom:18px}
.case{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;align-items:center;gap:11px}
.case .ic{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;font-size:15px}
.case .nm{font-weight:600;font-size:13px}
.case .mt{font-size:11.5px;color:var(--muted)}
.case .st{margin-left:auto;font-size:11px;font-weight:700;padding:3px 9px;border-radius:6px}
.st-open{background:var(--high-soft);color:var(--high)} .st-prog{background:var(--blue-soft);color:var(--blue)} .st-done{background:var(--ok-soft);color:var(--ok)}
/* timeline */
.tl{position:relative;padding-left:26px}
.tl::before{content:"";position:absolute;left:9px;top:6px;bottom:6px;width:2px;background:var(--line)}
.ev{position:relative;margin-bottom:16px}
.ev .node{position:absolute;left:-25px;top:2px;width:20px;height:20px;border-radius:50%;background:#fff;border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:9px}
.ev .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 13px}
.ev .meta{display:flex;align-items:center;gap:8px;margin-bottom:5px;flex-wrap:wrap}
.ev .meta .ag{font-weight:600;font-size:12.5px}
.ev .meta .tm{color:#9AA1AC;font-size:11px;margin-left:auto}
.ev .msg{font-size:12.5px;color:#3D4554}
.ev.dup .card{border-style:dashed;background:#FFFBF4;border-color:#F0DBB4}
.dupflag{font-size:10px;font-weight:700;color:#C77400;background:var(--accent-soft);padding:1px 6px;border-radius:5px}
/* reply */
.reply{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px;margin-top:14px}
.reply .rt{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.reply textarea{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px;font-family:inherit;font-size:13px;resize:none;outline:none;height:62px}
.reply textarea:focus{border-color:var(--accent)}
.reply .rb{display:flex;align-items:center;gap:8px;margin-top:9px}
.policy{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
.policy b{color:#41495A}
.hide{display:none!important}
.empty{padding:40px;text-align:center;color:var(--muted)}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;opacity:0;transition:all .25s;z-index:80;box-shadow:var(--shadow-lg);display:flex;align-items:center;gap:9px}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div class="app">
  <!-- TOP -->
  <div class="topbar">
    <div class="brand"><span class="logo">B</span>Brighterly <small>Agent Workspace</small></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
      <input placeholder="Search tutors, cases, or messages…">
    </div>
    <div class="topright">
      <div class="bell"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg><span class="dot"></span></div>
      <div class="me"><div class="avatar">MR</div><div><div class="nm">Maria R.</div><div class="rl">Supply Support</div></div></div>
    </div>
  </div>
  <!-- SIDE -->
  <div class="side">
    <div class="navlbl">Work</div>
    <div class="nav active" data-view="inbox"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-6l-2 3h-4l-2-3H2"/><path d="M5.45 5.11 2 12v6a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2v-6l-3.45-6.89A2 2 0 0 0 16.76 4H7.24a2 2 0 0 0-1.79 1.11z"/></svg>Unified Inbox<span class="ct">24</span></div>
    <div class="nav" data-view="mine"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>My Cases<span class="ct">6</span></div>
    <div class="nav" data-view="conflicts"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m21.7 16.5-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 19.5h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>Conflicts<span class="ct red" id="confCount">3</span></div>
    <div class="navlbl">Directory</div>
    <div class="nav" data-view="tutors"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"/></svg>Tutors<span class="ct">850</span></div>
    <div class="nav" data-view="sla"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>SLA Board</div>
    <div class="spacer"></div>
    <div class="gov">
      <h5>Comms Governance</h5>
      <div class="row"><span>SLA compliance</span><b class="dotgreen">94%</b></div>
      <div class="row"><span>Open collisions</span><b class="dotred">3</b></div>
      <div class="row"><span>Dedup blocked today</span><b>41</b></div>
      <div class="row"><span>Avg first response</span><b>11m</b></div>
    </div>
  </div>
  <!-- MAIN -->
  <div class="main" id="main"></div>
</div>

<!-- DRAWER -->
<div class="overlay" id="overlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer"></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- DATA ---------- */
const PAL=['#5865F2','#0E9F9A','#E08600','#2563EB','#7C5CFC','#2E9E5B','#E5484D','#C2410C'];
function col(s){let h=0;for(const c of s)h=c.charCodeAt(0)+((h<<5)-h);return PAL[Math.abs(h)%PAL.length]}
function ini(n){return n.split(' ').map(x=>x[0]).slice(0,2).join('')}
const CH={
 dm:{cls:'b-discord',lbl:'Discord DM'}, dchan:{cls:'b-dchan',lbl:'Discord #urgent'},
 ticket:{cls:'b-ticket',lbl:'Ticket'}, email:{cls:'b-email',lbl:'Email'}, omni:{cls:'b-omni',lbl:'Omnichannel'}
};
function chBadge(k){const c=CH[k];return `<span class="badge ${c.cls}"><span class="dotmark"></span>${c.lbl}</span>`}

const TUTORS={
 "Sarah Lin":{grade:"Grades 3–6 · Math",since:"Apr 2023",rating:"4.9",slots:"18/wk",status:"Active"},
 "James Okoro":{grade:"Grades 7–9 · Math",since:"Jan 2024",rating:"4.8",slots:"22/wk",status:"Active"},
 "Priya Nair":{grade:"Grades 1–4 · Reading",since:"Sep 2022",rating:"5.0",slots:"15/wk",status:"Active"},
 "Diego Alvarez":{grade:"Grades 9–12 · Math",since:"Mar 2024",rating:"4.7",slots:"20/wk",status:"On demo"},
 "Mei Tanaka":{grade:"Grades 2–5 · Reading",since:"Nov 2023",rating:"4.9",slots:"16/wk",status:"Active"},
 "Omar Haddad":{grade:"Grades 6–8 · Math",since:"Feb 2025",rating:"4.6",slots:"12/wk",status:"Active"},
 "Grace Bello":{grade:"Grades 1–3 · Reading",since:"Aug 2024",rating:"4.8",slots:"14/wk",status:"Active"},
 "Noah Schmidt":{grade:"Grades 10–12 · Math",since:"Jun 2023",rating:"4.9",slots:"19/wk",status:"Active"}
};
const INBOX=[
 {id:1,tutor:"Sarah Lin",pri:"urgent",ch:"dm",case:"Urgent sub",snip:"Can anyone cover my 4pm ET slot? Student is waiting…",sla:-4,assignee:"Maria R.",collision:["Daniel K."]},
 {id:2,tutor:"James Okoro",pri:"urgent",ch:"dchan",case:"New student",snip:"New 8th-grader needs a Tue/Thu match — who's open?",sla:9,assignee:"—",collision:[]},
 {id:3,tutor:"Diego Alvarez",pri:"urgent",ch:"omni",case:"Demo slot",snip:"I can take the 6pm demo today, confirm the link?",sla:14,assignee:"Maria R.",collision:[]},

  {ch:"dchan",ag:"Sarah Lin",me:false,t:"Today · 3:57pm",msg:"Posted the same request in #urgent-subs as well 🙏",dup:true},

  {ch:"email",ag:"Maria R.",me:true,t:"Mar 2",msg:"Confirmed your updated weekly availability. Thanks!",dup:false}
 ],
 "Priya Nair":[

const CONFLICTS=[

 {id:"c2",tutor:"Priya Nair",topic:"March payout discrepancy",a:{ag:"Lena P.",ch:"ticket",t:"58 min ago",note:"Owns the payout ticket"},b:{ag:"Maria R.",ch:"dm",t:"55 min ago",note:"Replied to her DM separately"},rec:"Hand off to Lena (ticket owner). Maria to drop the parallel DM thread."},
 {id:"c3",tutor:"Grace Bello",topic:"Sick cover — 3 morning slots",a:{ag:"Lena P.",ch:"dchan",t:"12 min ago",note:"Coordinating cover"},b:{ag:"Daniel K.",ch:"dm",t:"9 min ago",note:"Pinged Grace directly for details"},rec:"Two agents pinging the same tutor. Consolidate; Daniel to sync into Lena's thread."}
];

/* ---------- HELPERS ---------- */
function slaFmt(h){
 const warn=h<12;
 const cls=h<0?'danger':(h<2?'danger':(warn?'warn':'ok'));
 let txt;
 if(h<0) txt=`+${Math.abs(h)}h late`;
 else if(h<24) txt=`${h}h left`;
 else txt=`${Math.round(h/24)}d left`;
 const lbl=h<0?'SLA breached':'Respond in';
 return {cls,txt,lbl};
}
function priLabel(p){return p[0].toUpperCase()+p.slice(1)}
function avatar(n){return `<div class="av" style="background:${col(n)}">${ini(n)}</div>`}

/* ---------- VIEWS ---------- */
function renderInbox(filterCh){
 const rows=INBOX.filter(r=>!filterCh||filterCh==='all'||r.ch===filterCh)
   .sort((a,b)=>a.sla-b.sla);
 const stat=`<div class="stats">
   <div class="stat"><div class="k">📥 Active threads</div><div class="v">24</div><div class="d down">8–12 per tutor before</div></div>
   <div class="stat"><div class="k">🔴 Breaching SLA</div><div class="v">1</div><div class="d">1h response target</div></div>
   <div class="stat"><div class="k">⚠️ Collisions now</div><div class="v">3</div><div class="d down">2+ agents, same tutor</div></div>
   <div class="stat"><div class="k">⏱ Avg first response</div><div class="v">11m</div><div class="d up">vs 38m baseline</div></div>
 </div>`;
 const filters=`<div class="toolbar">
   <div class="seg" id="chSeg">
     <button class="${!filterCh||filterCh==='all'?'on':''}" onclick="setView('inbox','all')">All channels</button>
     <button class="${filterCh==='dm'?'on':''}" onclick="setView('inbox','dm')">Discord DM</button>
     <button class="${filterCh==='dchan'?'on':''}" onclick="setView('inbox','dchan')">Discord #</button>
     <button class="${filterCh==='ticket'?'on':''}" onclick="setView('inbox','ticket')">Tickets</button>
     <button class="${filterCh==='email'?'on':''}" onclick="setView('inbox','email')">Email</button>
     <button class="${filterCh==='omni'?'on':''}" onclick="setView('inbox','omni')">Omni</button>
   </div>
   <div class="spacerb"></div>
   <div class="chip on">Sort: SLA urgency <span class="x">▾</span></div>
   <div class="chip">Assignee: Anyone <span class="x">▾</span></div>
 </div>`;
 const head=`<div class="lhead"><div></div><div>Tutor</div><div>Last message</div><div>Channel</div><div>SLA</div><div>Owner</div></div>`;
 const list=rows.map(r=>{
   const s=slaFmt(r.sla);
   const coll=r.collision.length?`<span class="collide" onclick="event.stopPropagation();setView('conflicts')"><span class="pulse"></span>${r.collision.length+1} agents</span>`:'';
   const owner=r.assignee==='—'?'<span style="color:#B7BDC7">Unassigned</span>':`<div class="av" style="width:24px;height:24px;font-size:10px;background:${col(r.assignee)}">${ini(r.assignee)}</div>${r.assignee}`;
   return `<div class="li" onclick="openTutor('${r.tutor}')">
     <div class="pdot p-${r.pri}" title="${priLabel(r.pri)}"></div>
     <div class="tut">${avatar(r.tutor)}<div><div class="nm">${r.tutor}</div><div class="sub">${TUTORS[r.tutor].grade.split(' · ')[1]} · ${priLabel(r.pri)}</div></div></div>
     <div class="snip"><div class="top"><span class="tag">${r.case}</span>${coll}</div><div class="txt">${r.snip}</div></div>
     <div>${chBadge(r.ch)}</div>
     <div class="sla ${s.cls}"><small>${s.lbl}</small>${s.txt}</div>
     <div class="assign">${owner}</div>
   </div>`;
 }).join('');
 return `<div class="viewhead"><h1>Unified Inbox</h1><p>Every tutor conversation — all 5 channels, one queue, ranked by SLA.</p></div>
   ${stat}${filters}<div class="list">${head}${list||'<div class="empty">No threads in this channel right now.</div>'}</div>`;
}

function renderConflicts(){
 const cards=CONFLICTS.map(c=>`
  <div class="conf" id="${c.id}">
    <div class="ch">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#E5484D" stroke-width="2"><path d="m21.7 16.5-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 19.5h16a2 2 0 0 0 1.7-3z"/><path d="M12 9v4M12 17h.01"/></svg>
      <h3>${c.tutor}</h3><span class="tag">${c.topic}</span>
    </div>
    <div class="versus">
      <div class="party">
        <div class="who">${avatar(c.a.ag)}<b>${c.a.ag}</b></div>
        <div class="meta">Channel: <b>${CH[c.a.ch].lbl}</b></div>
        <div class="meta">${c.a.note}</div>
        <div class="meta" style="color:#9AA1AC">Active ${c.a.t}</div>
      </div>
      <div class="vs">VS</div>
      <div class="party">
        <div class="who">${avatar(c.b.ag)}<b>${c.b.ag}</b></div>
        <div class="meta">Channel: <b>${CH[c.b.ch].lbl}</b></div>
        <div class="meta">${c.b.note}</div>
        <div class="meta" style="color:#9AA1AC">Active ${c.b.t}</div>
      </div>
    </div>
    <div class="rec">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.3 1 2.1V18h6v-1.2c0-.8.4-1.6 1-2.1A7 7 0 0 0 12 2z"/></svg>
      <span><b>Suggested:</b> ${c.rec}</span>
      <span class="cact"><button class="btn" onclick="openTutor('${c.tutor}')">View thread</button><button class="btn primary" onclick="resolveConf('${c.id}')">Merge & assign</button></span>
    </div>
  </div>`).join('');
 return `<div class="viewhead"><h1>Conflicts</h1><p>Two or more agents engaging the same tutor. Detected in real time before duplicate messages go out.</p></div>${cards}`;
}

function renderSimple(title,sub,body){
 return `<div class="viewhead"><h1>${title}</h1><p>${sub}</p></div>${body}`;
}

function renderMine(){
 const mine=INBOX.filter(r=>r.assignee==='Maria R.');
 const head=`<div class="lhead"><div></div><div>Tutor</div><div>Last message</div><div>Channel</div><div>SLA</div><div>Owner</div></div>`;
 const list=mine.map(r=>{const s=slaFmt(r.sla);return `<div class="li" onclick="openTutor('${r.tutor}')">
   <div class="pdot p-${r.pri}"></div>
   <div class="tut">${avatar(r.tutor)}<div><div class="nm">${r.tutor}</div><div class="sub">${priLabel(r.pri)}</div></div></div>
   <div class="snip"><div class="top"><span class="tag">${r.case}</span></div><div class="txt">${r.snip}</div></div>
   <div>${chBadge(r.ch)}</div><div class="sla ${s.cls}"><small>${s.lbl}</small>${s.txt}</div>
   <div class="assign"><div class="av" style="width:24px;height:24px;font-size:10px;background:${col('Maria R.')}">MR</div>You</div></div>`}).join('');
 return renderSimple('My Cases','Threads where you are the named owner. Channel policy keeps you as single point of contact.',`<div class="list">${head}${list}</div>`);
}
function renderTutors(){
 const cards=Object.entries(TUTORS).map(([n,t])=>`<div class="li" onclick="openTutor('${n}')">
   <div class="pdot p-normal" style="visibility:hidden"></div>
   <div class="tut">${avatar(n)}<div><div class="nm">${n}</div><div class="sub">${t.grade}</div></div></div>
   <div class="snip"><div class="txt">Since ${t.since} · ${t.slots} · ★ ${t.rating}</div></div>
   <div><span class="tag">${t.status}</span></div><div class="sla ok"><small>History</small>open ▸</div><div></div></div>`).join('');
 const head=`<div class="lhead"><div></div><div>Tutor</div><div>Profile</div><div>Status</div><div></div><div></div></div>`;
 return renderSimple('Tutor Directory','850 active tutors. One profile each — full cross-channel history, cases and SLA in one record.',`<div class="list">${head}${cards}</div>`);
}
function renderSLA(){
 const body=`<div class="stats">
   <div class="stat"><div class="k">Urgent · 1h target</div><div class="v">94%</div><div class="d up">on time</div></div>
   <div class="stat"><div class="k">Background · 8h target</div><div class="v">97%</div><div class="d up">on time</div></div>
   <div class="stat"><div class="k">Breached today</div><div class="v">3</div><div class="d down">of 212 threads</div></div>
   <div class="stat"><div class="k">Median first reply</div><div class="v">11m</div><div class="d up">vs 38m baseline</div></div>
 </div>
 <div class="list"><div class="lhead"><div></div><div>Channel</div><div>Policy</div><div>Volume</div><div>SLA met</div><div></div></div>
 ${[['dm','Quick 1:1 — urgent ops only','45%','92%'],['dchan','Broadcast — subs & new students','20%','95%'],['ticket','Admin & payout requests','15%','98%'],['email','Official / formal record','12%','99%'],['omni','Demo-tutor slotting','8%','96%']].map(([k,p,v,s])=>`<div class="li" style="cursor:default"><div></div><div>${chBadge(k)}</div><div class="snip"><div class="txt">${p}</div></div><div>${v}</div><div class="sla ok"><small>met</small>${s}</div><div></div></div>`).join('')}
 </div>`;
 return renderSimple('SLA Board','Channel policy + service levels in one place — what belongs where, and how we are tracking.',body);
}

/* ---------- DRAWER ---------- */
function openTutor(name){
 const t=TUTORS[name]; const tl=TIMELINES[name]||defaultTimeline(name);
 const inboxItem=INBOX.find(r=>r.tutor===name);
 const collab=inboxItem&&inboxItem.collision.length?`
  <div class="collab">
    <div class="av">${ini(inboxItem.collision[0])}</div>
    <div class="tx"><b>${inboxItem.collision.join(', ')}</b> ${inboxItem.collision.length>1?'are':'is'} also active with ${name.split(' ')[0]} right now — re: <b>${inboxItem.case}</b>.</div>
    <button class="btn" onclick="setView('conflicts')">Resolve</button>
  </div>`:'';
 const cases=buildCases(name);
 const events=tl.map(e=>`
  <div class="ev ${e.dup?'dup':''}">
    <div class="node" style="border-color:${e.me?'#F39B2D':col(e.ag)}">${e.me?'✎':''}</div>
    <div class="card">
      <div class="meta">${chBadge(e.ch)}<span class="ag">${e.me?'You':e.ag}</span>${e.dup?'<span class="dupflag">duplicate</span>':''}<span class="tm">${e.t}</span></div>
      <div class="msg">${e.msg}</div>
    </div>
  </div>`).join('');
 const headAv=`<div class="av" style="width:46px;height:46px;font-size:16px;background:${col(name)}">${ini(name)}</div>`;
 const html=`
  <div class="dh">
    <div class="top">
      ${headAv}
      <div><h2>${name}</h2><div class="sub">${t.grade}</div></div>
      <div class="close" onclick="closeDrawer()"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M18 6 6 18M6 6l12 12"/></svg></div>
    </div>
    <div class="facts">
      <div class="fact">Tutor since<b>${t.since}</b></div>
      <div class="fact">Rating<b>★ ${t.rating}</b></div>
      <div class="fact">Slots<b>${t.slots}</b></div>
      <div class="fact">Status<b>${t.status}</b></div>
    </div>
  </div>
  <div class="dbody">
    ${collab}
    <div class="sechd">Open cases</div>
    <div class="cases">${cases}</div>
    <div class="sechd">Interaction history · all channels</div>
    <div class="tl">${events}</div>
    <div class="reply">
      <div class="rt"><span class="policy">Reply via <b>Discord DM</b></span><span class="chip" style="padding:3px 9px;margin-left:auto">Change channel ▾</span></div>
      <textarea placeholder="Type a reply to ${name.split(' ')[0]}… (single thread — syncs across channels)"></textarea>
      <div class="rb">
        <span class="policy">🛡 <b>Channel policy:</b> urgent sub → keep in DM; you are the single owner.</span>
        <button class="btn primary" style="margin-left:auto" onclick="toast('Reply sent · case updated, collision cleared')">Send</button>
      </div>
    </div>
  </div>`;
 const d=document.getElementById('drawer');
 d.innerHTML=html; d.classList.add('show'); document.getElementById('overlay').classList.add('show');
}
function defaultTimeline(name){
 const r=INBOX.find(x=>x.tutor===name);
 const ch=r?r.ch:'dm', snip=r?r.snip:'Reached out via '+CH[ch].lbl+'.';
 return [
  {ch,ag:name,me:false,t:"Today",msg:snip,dup:false},
  {ch:"email",ag:"Maria R.",me:true,t:"Last week",msg:"Confirmed your schedule for the coming week. Thanks!",dup:false},
  {ch:"ticket",ag:name,me:false,t:"Mar 4",msg:"Resolved: access to updated lesson materials.",dup:false}
 ];
}
function buildCases(name){
 const map={
  "Sarah Lin":[['🔁','Urgent sub — 4pm slot','Opened 4 min ago · SLA breached','st-open','Open']],
  "Priya Nair":[['💵','Payout discrepancy (March)','Owner: Lena P. · 58 min','st-prog','In progress']],
  "James Okoro":[['🎓','New student match','Unassigned · 9h left','st-open','Open']],
  "Grace Bello":[['🤒','Sick cover — 3 slots','2 agents · 33h left','st-open','Open']]
 };
 const def=[['💬','General thread','Active today','st-prog','In progress'],['✅','Schedule update','Closed last week','st-done','Closed']];
 return (map[name]||def).map(c=>`<div class="case"><div class="ic" style="background:${col(c[1])}22">${c[0]}</div><div><div class="nm">${c[1]}</div><div class="mt">${c[2]}</div></div><span class="st ${c[3]}">${c[4]}</span></div>`).join('');
}
function closeDrawer(){document.getElementById('drawer').classList.remove('show');document.getElementById('overlay').classList.remove('show')}

/* ---------- CONFLICT RESOLVE ---------- */
let resolved=new Set();
function resolveConf(id){
 const el=document.getElementById(id); if(!el)return;
 const wasNew=!resolved.has(id);
 resolved.add(id); el.classList.add('resolved');
 const rec=el.querySelector('.rec');
 rec.innerHTML=`<div class="resbar"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M20 6 9 17l-5-5"/></svg> Merged into one case · single owner assigned · duplicate thread closed.</div>`;
 const left=CONFLICTS.length-resolved.size;
 document.getElementById('confCount').textContent=left;
 if(left===0)document.getElementById('confCount').classList.remove('red');
 if(wasNew)toast('Conflict resolved · tutor now has one owner');
}

/* ---------- ROUTER ---------- */
let cur='inbox';
function setView(v,arg){
 cur=v;
 document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('active',n.dataset.view===v));
 const m=document.getElementById('main');
 if(v==='inbox')m.innerHTML=renderInbox(arg);
 else if(v==='conflicts')m.innerHTML=renderConflicts();
 else if(v==='mine')m.innerHTML=renderMine();
 else if(v==='tutors')m.innerHTML=renderTutors();
 else if(v==='sla')m.innerHTML=renderSLA();
 m.scrollTop=0;
 if(v==='conflicts')resolved.forEach(id=>resolveConf(id));
 closeDrawer();
}
document.querySelectorAll('.nav').forEach(n=>n.addEventListener('click',()=>setView(n.dataset.view)));
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('show');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('show'),2400)}
setView('inbox','all');
</script>
</body>
